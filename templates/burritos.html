<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Food Menu</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
        }

        /* LEFT NAVIGATION */

        .sidebar {
            position: fixed;
            left: 0;
            top: 0;

            width: 180px;
            height: 100vh;

            background-color: #222;

            padding: 30px 20px;

            display: flex;
            flex-direction: column;
        }

        .sidebar h1 {
            color: white;
            text-align: center;
            margin-bottom: 40px;
        }

        .sidebar a {
            color: white;
            text-decoration: none;

            padding: 18px 15px;
            margin-bottom: 10px;

            font-size: 20px;

            border-radius: 8px;
        }

        .sidebar a:hover {
            background-color: #444;
        }


        /* BOTTOM CART NAVIGATION */

        .bottom-nav {
            position: fixed;

            bottom: 0;
            left: 180px;
            right: 0;

            height: 80px;

            background-color: white;

            display: flex;
            justify-content: flex-end;
            align-items: center;

            padding: 0 40px;

            box-shadow: 0 -2px 8px rgba(0, 0, 0, 0.15);

            z-index: 10;
        }

        .cart {
            text-decoration: none;
            color: #222;

            font-size: 20px;
            font-weight: bold;

            padding: 12px 25px;

            border-radius: 8px;
        }

        .cart:hover {
            background-color: #eeeeee;
        }


        /* MAIN CONTENT */

        main {
            margin-left: 220px;

            padding: 60px;

            padding-bottom: 120px;
        }

        h2 {
            font-size: 42px;
            margin-bottom: 10px;
        }

        p {
            font-size: 20px;
        }


        /* FOOD CARDS */

        .food-grid {
            display: grid;

            grid-template-columns: repeat(3, 1fr);

            gap: 30px;

            margin-top: 50px;
        }

        .food-card {
            background-color: white;

            border-radius: 15px;

            overflow: hidden;

            text-decoration: none;
            color: #222;

            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.15);

            transition: transform 0.2s;
        }

        .food-card:hover {
            transform: translateY(-5px);
        }

        .food-card img {
            width: 100%;
            height: 250px;

            object-fit: cover;
        }

        .food-card h3 {
            font-size: 28px;

            padding: 20px;

            margin: 0;
        }
    </style>
</head>


<body>

    <!-- LEFT NAVIGATION -->

    <nav class="sidebar">

        <h1>MENU</h1>

        <a href="/">Home</a>

        <a href="/burritos">Burritos</a>

        <a href="pizza.html">Pizza</a>

        <a href="lunch.html">Lunch</a>

    </nav>


    <!-- MAIN CONTENT -->

    <main id="home">

        <h2>Welcome</h2>

        <p>
            Choose from our menu below.
        </p>


        <div class="food-grid">

            <!-- BURRITOS -->

            <a href="/product/grilled-chicken-burrito" class="food-card">

                <img
                    src="https://th.bing.com/th/id/OIP.xyP63aRnT29EpeYRnriHYgHaHa?w=195&h=195&c=7&r=0&o=7&dpr=1.3&pid=1.7&rm=3"
                    alt="Grilled Chicken Burrito">

                <h3>Grilled Chicken Burrito</h3>

            </a>

            <a href="/product/crispy-chicken-burrito" class="food-card">

                <img
                    src="https://images.unsplash.com/photo-1574071318508-1cdbab80d002?auto=format&fit=crop&w=800&q=80"
                    alt="Crispy Chicken Burrito">

                <h3>Crispy Chicken Burrito</h3>

            </a>


        </div>

    </main>


    <!-- BOTTOM CART -->

    <nav class="bottom-nav">

        <a href="/cart" class="cart">
            🛒 Cart
        </a>

    </nav>

</body>

</html>
