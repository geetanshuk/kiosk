
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{{ product.name }}</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            color: #222;
        }


        /* TOP BAR */

        .top-bar {
            height: 80px;

            background-color: white;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 40px;

            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .back-button {
            text-decoration: none;
            color: #222;

            font-size: 18px;
            font-weight: bold;

            padding: 12px 20px;

            border-radius: 8px;
        }

        .back-button:hover {
            background-color: #eeeeee;
        }

        .cart {
            text-decoration: none;
            color: #222;

            font-size: 18px;
            font-weight: bold;

            padding: 12px 20px;

            border-radius: 8px;
        }

        .cart:hover {
            background-color: #eeeeee;
        }


        /* PRODUCT AREA */

        .product-page {
            min-height: calc(100vh - 80px);

            display: flex;

            justify-content: center;
            align-items: center;

            padding: 50px;
        }


        /* PRODUCT CARD */

        .product-card {
            width: 100%;
            max-width: 1000px;

            background-color: white;

            border-radius: 20px;

            overflow: hidden;

            display: grid;

            grid-template-columns: 1fr 1fr;

            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.12);
        }


        /* PRODUCT IMAGE */

        .product-image {
            width: 100%;
            height: 100%;

            min-height: 500px;

            object-fit: cover;
        }


        /* PRODUCT INFORMATION */

        .product-info {
            padding: 50px;

            display: flex;
            flex-direction: column;

            justify-content: center;
        }

        .product-info h1 {
            font-size: 42px;

            margin: 0 0 20px;
        }

        .description {
            font-size: 19px;

            line-height: 1.6;

            color: #555;

            margin-bottom: 25px;
        }

        .price {
            font-size: 30px;

            font-weight: bold;

            margin-bottom: 30px;
        }


        /* QUANTITY */

        .quantity {
            display: flex;

            align-items: center;

            gap: 15px;

            margin-bottom: 30px;
        }

        .quantity label {
            font-size: 18px;

            font-weight: bold;
        }

        .quantity input {
            width: 70px;

            padding: 12px;

            font-size: 18px;

            text-align: center;

            border: 1px solid #ccc;

            border-radius: 8px;
        }


        /* ADD TO CART */

        .add-cart {
            width: 100%;

            padding: 18px;

            border: none;

            border-radius: 10px;

            background-color: #222;

            color: white;

            font-size: 20px;

            font-weight: bold;

            cursor: pointer;
        }

        .add-cart:hover {
            background-color: #444;
        }


        /* MOBILE */

        @media (max-width: 800px) {

            .product-card {
                grid-template-columns: 1fr;
            }

            .product-image {
                min-height: 300px;
            }

            .product-info {
                padding: 30px;
            }

            .product-info h1 {
                font-size: 32px;
            }

            .product-page {
                padding: 20px;
            }
        }

        .cart-count {
    display: inline-flex;
    align-items: center;
    justify-content: center;

    min-width: 20px;
    height: 20px;
    padding: 0 6px;

            margin-left: 4px;

            background: #ff8fab;
            color: white;
            border: 2px solid white;
            border-radius: 50%;

            font-size: 11px;
            font-weight: 700;
            line-height: 1;

            position: relative;
            top: -3px;
        }

        .cart-count:empty {
            display: none;
        }

    </style>

</head>


<body>


    <!-- TOP BAR -->

    <header class="top-bar">

        <a href="/" class="back-button">
            ← Back
        </a>

        <a href="/cart" class="cart">
            🛒 Cart<span class="cart-count"></span>
        </a>

    </header>


    <!-- PRODUCT -->

    <main class="product-page">

        <div class="product-card">


            <!-- IMAGE -->

            <img
                class="product-image"
                src="{{ url_for('static', filename=product.image) }}"
                alt="{{ product.name }}"
            >


            <!-- INFORMATION -->

            <div class="product-info">

                <h1>
                    {{ product.name }}
                </h1>


                <p class="description">
                    {{ product.description }}
                </p>


                <div class="price">
                    ${{ "%.2f"|format(product.price) }}
                </div>


                <!-- QUANTITY -->

                <div class="quantity">

                    <label for="quantity">
                        Quantity
                    </label>

                    <input
                        type="number"
                        id="quantity"
                        value="1"
                        min="1"
                    >

                </div>


                <!-- ADD TO CART -->

                <button class="add-cart" id = "add-cart" data-name="{{ product.name }}"
                    data-price="{{ product.price }}"
                    data-img="{{ product.image }}"
                    data-quantity="{{product.quantity}}">
                    
                    Add to Cart
                </button>

            </div>

        </div>

    </main>
    <script src="{{ url_for('static', filename='scripts.js') }}"></script>

</body>

</html>
